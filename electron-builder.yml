# 打包配置
#
# 三种产物，按需选择：
#   nsis      安装包（含卸载程序，写注册表，开始菜单+桌面快捷方式）
#   portable  便携版（单文件 exe，双击即用，不写注册表）
#   （zip 由 scripts/build-local.mjs 额外生成）
#
# 只把运行必需的东西塞进发行包：
#   src/        主进程与界面
#   vendor/     scrcpy 服务端（约 700KB，会被推送到手机上运行）
#   resources/  图标

appId: com.aoid.app
productName: Aoid
copyright: Copyright © 2026 l-xyzz

directories:
  output: release
  buildResources: resources

# 只打包运行需要的文件，源码地图、文档、脚本一律排除
files:
  - 'src/**/*'
  - 'resources/icon.png'
  - 'package.json'
  - '!**/*.map'
  # 「关于」和「隐私」页要直接读取这些文档，必须打进包里
  - 'README.md'
  - 'CHANGELOG.md'
  - 'LICENSE'
  - 'PRIVACY.md'
  - 'THIRD-PARTY-NOTICES.md'
  # 英文文档：界面语言不是中文时优先使用
  - 'README.en.md'
  - 'PRIVACY.en.md'
  - 'THIRD-PARTY-NOTICES.en.md'
  # 界面截图（README 与 README.en 各自引用一份）
  - 'docs/screenshot.png'
  - 'docs/screenshot.en.png'

# scrcpy 服务端需要在运行时读取，因此放在 asar 之外
extraResources:
  - from: vendor/scrcpy-server-v5.0.1
    to: vendor/scrcpy-server-v5.0.1
  # 官方 scrcpy 运行组件：音频播放由它负责（务必一起打包）
  - from: scrcpy-runtime
    to: scrcpy-runtime
    filter:
      # scrcpy-runtime 目录里自带一份 adb（约 8MB），但程序优先用
      # resources/platform-tools 下那份（见 core/context.js 的 内置工具目录），
      # 这里那份永远不会被读取，排除掉省 8MB。
      - '!adb.exe'
      - '!AdbWinApi.dll'
      - '!AdbWinUsbApi.dll'
      # 运行期产生的录音缓存，没必要打包
      - '!mic-cache/**'
  # 随包附带 adb，首次运行不必再下载
  - from: platform-tools
    to: platform-tools
    filter:
      - 'adb.exe'
      - 'AdbWinApi.dll'
      - 'AdbWinUsbApi.dll'

asar: true

# 打包完成后清理用不到的 Chromium 组件（见 scripts/after-pack.js）
afterPack: scripts/after-pack.js

# 只保留实际用到的 Chromium 语言包。
#
# 默认会打全部 55 种语言，共 48.8 MB，其中最大的几个（ml/ta/kn/te/hi）单个就 1.7MB。
# Aoid 界面只有中文和英文，留这两个 + 繁体中文（用户可能用港台系统）足够，
# **不影响任何功能**，只是省掉 45MB 无用的翻译文件。
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - en-GB
compression: maximum

win:
  target:
    # 安装包：带卸载程序，普通用户首选
    - target: nsis
      arch:
        - x64
    # 便携版：免安装，放 U 盘也能跑
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico

# ---- 安装包 ----
nsis:
  # 默认装到当前用户目录（%LOCALAPPDATA%\Programs\Aoid），不需要管理员权限，
  # 也就不会弹 UAC。这符合「轻量小工具」的定位。
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aoid
  # 卸载时保留用户数据（设置、历史设备），重新装回来还能接着用。
  # 想彻底清干净的话，卸载后手动删 %APPDATA%\Aoid。
  deleteAppDataOnUninstall: false
  # 安装完成后不自动启动。
  # 自动启动会在安装器收尾时又拉起 Aoid.exe，
  # 导致「文件仍被占用」→ 进度条反复倒退重试。
  # 用户点桌面快捷方式启动即可，代价几乎为零。
  runAfterFinish: false
  # 卸载程序显示名，控制面板里看到的就是这个
  uninstallDisplayName: Aoid ${version}
  artifactName: Aoid-${version}-Setup.${ext}
  # 安装前强制结束旧进程，避免「Aoid 无法关闭」提示（见 build/installer.nsh）
  include: build/installer.nsh

# ---- 便携版 ----
portable:
  artifactName: Aoid-${version}-Portable.${ext}
  unpackDirName: Aoid

# 不做自动更新
publish: null

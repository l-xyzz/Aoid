<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data:; font-src 'self'"
    />
    <title>Aoid</title>
    <style>
      /*
       * 沉浸窗口：只装手机画面 + 三个窗口控件。
       *
       * 背景纯黑，画面用 object-fit: contain 居中显示 ——
       * 窗口比例和手机比例不一致时，多出来的部分自然是黑边，
       * 画面绝不拉伸变形。这是这一版最关键的约束。
       */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      .沉浸根 {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        display: grid;
        place-items: center;
      }

      /*
       * 画面：按手机比例缩放并居中。
       *
       * canvas 的 object-fit 不生效（那是给 img/video 的），
       * 所以缩放交给 JS 在 immersive.js 里根据窗口尺寸实时计算，
       * 这里只负责居中。
       */
      .沉浸画布 {
        display: block;
        background: #000;
      }

      /*
       * 窗口控件：浮在右上角。
       * 平时很淡（不抢画面），鼠标移到顶部区域才显现。
       */
      .沉浸控件 {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 2px;
        padding: 0 6px;
        box-sizing: border-box;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent);
        opacity: 0.22;
        transition: opacity 0.18s ease;
        z-index: 10;
        /* 整条都可拖动窗口 */
        -webkit-app-region: drag;
      }

      .沉浸控件:hover {
        opacity: 1;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0.25));
      }

      .沉浸控件按钮 {
        -webkit-app-region: no-drag;
        width: 34px;
        height: 26px;
        display: grid;
        place-items: center;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: rgba(255, 255, 255, 0.85);
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }

      .沉浸控件按钮:hover {
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
      }

      .沉浸控件按钮.关闭:hover {
        background: #c42b1c;
      }

      .沉浸控件按钮 svg {
        width: 12px;
        height: 12px;
      }

      /* 未连接时居中提示 */
      .沉浸空态 {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(255, 255, 255, 0.5);
        font: 13px/1.8 system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        text-align: center;
        pointer-events: none;
      }

      /*
       * display:grid 会盖掉 [hidden] 的 display:none。
       *
       * CSS 特异性：类选择器 .沉浸空态 比属性选择器 [hidden] 高一级，
       * 所以只设 hidden 属性不生效，元素照样显示 ——
       * 表现就是「画面已经出来了，"等待手机画面…"这行字还留在上面」。
       * 这里补一条 .沉浸空态[hidden] 把它压回去。
       */
      .沉浸空态[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="沉浸根">
      <canvas class="沉浸画布" id="沉浸画布" width="590" height="1280"></canvas>

      <div class="沉浸空态" id="沉浸空态">等待手机画面…</div>

      <div class="沉浸控件">
        <button class="沉浸控件按钮" id="沉浸最小化" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M2 6h8" />
          </svg>
        </button>
        <button class="沉浸控件按钮" id="沉浸最大化" title="最大化" aria-label="最大化">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="2.5" y="2.5" width="7" height="7" rx="1" />
          </svg>
        </button>
        <button class="沉浸控件按钮 关闭" id="沉浸关闭" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M3 3l6 6M9 3l-6 6" />
          </svg>
        </button>
      </div>
    </div>

    <script type="module" src="./js/immersive.js"></script>
  </body>
</html>

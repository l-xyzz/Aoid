<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Aoid 更多功能</title>
    <link rel="stylesheet" href="./styles/app.css" />
    <style>
      /* 工具窗口的布局：左侧菜单 + 右侧内容 */
      .工具页 {
        display: grid;
        grid-template-columns: 148px minmax(0, 1fr);
        height: 100vh;
        background: var(--底-0);
        color: var(--字-主);
        font-family: var(--字体);
        font-size: 12.5px;
      }

      .工具菜单 {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 12px 8px;
        background: var(--底-1);
        border-right: 1px solid var(--线-弱);
        overflow-y: auto;
      }

      .工具菜单项 {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--字-次);
        font-size: 12.5px;
        text-align: left;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }

      .工具菜单项:hover {
        background: var(--底-2);
        color: var(--字-主);
      }

      .工具菜单项.选中 {
        background: var(--强调-淡);
        color: var(--强调);
        font-weight: 600;
      }

      .工具菜单项 svg {
        width: 15px;
        height: 15px;
        flex: none;
      }

      .工具内容 {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .工具头 {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--线-弱);
        flex: none;
      }

      .工具头 h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }

      .工具头 .间隔 {
        flex: 1;
      }

      .工具体 {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px 16px;
      }

      .工具体[hidden] {
        display: none;
      }

      /* 通用列表行 */
      .工具列表 {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .工具行 {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        border-radius: 6px;
        background: var(--底-1);
      }

      .工具行:hover {
        background: var(--底-2);
      }

      /* 单击选中的文件行，给个明显底色，避免用户以为没选中 */
      .工具行.选中 {
        background: var(--底-3, rgba(245, 165, 36, 0.16));
        box-shadow: inset 2px 0 0 var(--强调);
      }

      /* 文件行上的操作按钮默认淡出，悬停整行才显出来，免得每行挂一堆按钮很挤 */
      /* ---------- 文件管理双栏 ---------- */
      .文件双栏 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        flex: 1 1 auto;
        min-height: 0;
      }

      .文件栏 {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--底-1);
        border: 1px solid var(--线);
        border-radius: 8px;
        overflow: hidden;
      }

      .文件栏头 {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--线);
      }

      .文件栏标 {
        font-weight: 600;
        font-size: 12.5px;
        white-space: nowrap;
      }

      .文件栏路径 {
        font-size: 11.5px;
        color: var(--字-次);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1 1 auto;
      }

      .文件工具条 {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px 8px;
        border-bottom: 1px solid var(--线);
        flex-wrap: wrap;
      }

      .文件工具条 .次级按钮,
      .文件工具条 .次要按钮 {
        padding: 2px 8px;
        font-size: 11.5px;
      }

      .主按钮 {
        padding: 6px 16px;
        border: 1px solid var(--强调);
        border-radius: 6px;
        background: var(--强调);
        color: #0b0d10;
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
      }

      .主按钮:hover { filter: brightness(1.08); }

      .图标按钮 {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--线);
        border-radius: 5px;
        background: var(--底-2);
        color: var(--字);
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
      }

      .图标按钮:hover { background: var(--底-3, #34343a); }

      .工具条分隔 {
        width: 1px;
        height: 16px;
        background: var(--线);
        margin: 0 3px;
      }

      .文件表头 {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        font-size: 11px;
        color: var(--字-次);
        border-bottom: 1px solid var(--线);
      }

      .多选格 { width: 14px; flex: none; }
      .列名 { flex: 1 1 auto; }
      .列型 { width: 52px; flex: none; }
      .列大 { width: 68px; flex: none; text-align: right; }

      .文件栏列表 {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 4px;
      }

      .文件栏脚 {
        padding: 4px 10px;
        font-size: 11px;
        color: var(--字-次);
        border-top: 1px solid var(--线);
      }

      /* 文件行：勾选框 + 名称 + 类型 + 大小 */
      .文件行 {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 6px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
      }

      .文件行:hover { background: var(--底-2); }

      .文件行.已选 {
        background: rgba(245, 165, 36, 0.18);
      }

      .文件行 input[type='checkbox'] {
        width: 14px;
        height: 14px;
        flex: none;
        accent-color: var(--强调);
      }

      .文件行 .名字 {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .文件行 .类型,
      .文件行 .尺寸 {
        font-size: 11px;
        color: var(--字-次);
        flex: none;
      }

      .文件行 .类型 { width: 52px; }
      .文件行 .尺寸 { width: 68px; text-align: right; }

      /* 传输队列 */
      .传输区 {
        margin-top: 10px;
        border: 1px solid var(--线);
        border-radius: 8px;
        background: var(--底-1);
        display: flex;
        flex-direction: column;
        max-height: 168px;
        flex: none;
      }

      .传输头 {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-bottom: 1px solid var(--线);
        font-size: 12px;
        font-weight: 600;
      }

      .传输提示 {
        font-size: 11.5px;
        color: var(--字-次);
        font-weight: 400;
      }

      .传输列表 {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 4px 6px;
        font-size: 11.5px;
      }

      .传输项 {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 4px;
        border-bottom: 1px solid var(--线);
      }

      .传输项:last-child { border-bottom: none; }

      .传输项 .名 {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .传输项 .态 {
        flex: none;
        width: 84px;
        text-align: right;
        color: var(--字-次);
      }

      .传输项 .态.成功 { color: #4ec97a; }
      .传输项 .态.失败 { color: #f26d6d; }

      .工具行 .文字按钮 {
        opacity: 0;
        transition: opacity 0.12s;
      }

      .工具行:hover .文字按钮,
      .工具行.选中 .文字按钮 {
        opacity: 1;
      }

      .工具行 .主文 {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .工具行 .次文 {
        color: var(--字-弱);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        flex: none;
      }

      /* 文件管理：左右双栏 */
      .文件双栏 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        height: 100%;
        min-height: 0;
      }

      .文件栏 {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border: 1px solid var(--线-弱);
        border-radius: 8px;
        overflow: hidden;
      }

      .文件栏头 {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        background: var(--底-1);
        border-bottom: 1px solid var(--线-弱);
        flex: none;
        font-size: 11px;
      }

      .文件栏路径 {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--字体-数字);
        color: var(--字-次);
      }

      .文件栏列表 {
        flex: 1;
        overflow-y: auto;
        padding: 5px;
      }

      /* ADB 控制台 */
      .控制台 {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        gap: 8px;
      }

      .控制台输出 {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--底-0);
        border: 1px solid var(--线-弱);
        font-family: var(--字体-数字);
        font-size: 12px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-all;
        /* 终端输出必须能选中复制：body 上有全局 user-select:none，这里要覆盖回来 */
        user-select: text;
        cursor: text;
      }

      /* 选中高亮：在深色底上给出清晰的反色块 */
      .控制台输出 ::selection,
      .控制台输出::selection,
      .控制台输入::selection {
        background: var(--强调);
        color: #101014;
      }

      /* 自定义滚动条，跟主界面一致 */
      .控制台输出::-webkit-scrollbar,
      .文件栏列表::-webkit-scrollbar,
      .工具体::-webkit-scrollbar {
        width: 10px;
      }
      .控制台输出::-webkit-scrollbar-track,
      .文件栏列表::-webkit-scrollbar-track,
      .工具体::-webkit-scrollbar-track {
        background: transparent;
      }
      .控制台输出::-webkit-scrollbar-thumb,
      .文件栏列表::-webkit-scrollbar-thumb,
      .工具体::-webkit-scrollbar-thumb {
        background: var(--线-强);
        border-radius: 999px;
        border: 3px solid transparent;
        background-clip: content-box;
      }

      .控制台输入行 {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: none;
        padding: 7px 10px;
        border-radius: 8px;
        background: var(--底-0);
        border: 1px solid var(--线-弱);
        font-family: var(--字体-数字);
      }

      .控制台输入行:focus-within {
        border-color: var(--强调);
      }

      .控制台提示符 {
        color: var(--强调);
        font-family: var(--字体-数字);
        font-size: 12px;
        flex: none;
      }

      .控制台输入 {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--字-主);
        font-family: var(--字体-数字);
        font-size: 12.5px;
        outline: none;
      }

      /* 语法高亮 */
      .高亮-命令 {
        color: #7dd3fc;
        font-weight: 600;
      }
      .高亮-参数 {
        color: #fbbf24;
      }
      .高亮-字符串 {
        color: #86efac;
      }
      .高亮-路径 {
        color: #c4b5fd;
      }
      .高亮-提示 {
        color: var(--字-弱);
      }
      .高亮-错误 {
        color: #f87171;
      }

      /* 补全下拉 */
      .补全框 {
        position: fixed;
        z-index: 50;
        min-width: 220px;
        max-height: 240px;
        overflow-y: auto;
        padding: 4px;
        border-radius: 8px;
        background: var(--底-浮层);
        border: 1px solid var(--线);
        box-shadow: var(--阴影);
      }

      .补全框[hidden] {
        display: none;
      }

      .补全项 {
        padding: 5px 9px;
        border-radius: 5px;
        font-family: var(--字体-数字);
        font-size: 12px;
        color: var(--字-次);
        cursor: pointer;
      }

      .补全项:hover,
      .补全项.选中 {
        background: var(--强调-淡);
        color: var(--强调);
      }

      .空提示 {
        padding: 24px;
        text-align: center;
        color: var(--字-弱);
        font-size: 12px;
      }

      /* ===== 外设（摄像头/麦克风）卡片样式，从 features.html 并入 ===== */
      .外设内容 {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 4px 2px;
      }

      .外设状态行 {
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }

      .外设状态 {
        font-size: 11.5px;
        color: var(--字-弱);
      }

      .卡片 {
        border-radius: 12px;
        border: 1px solid var(--线-弱);
        background: var(--底-2);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .卡片 h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--字-主);
      }

      .卡片说明 {
        margin: 0;
        font-size: 11.5px;
        line-height: 1.65;
        color: var(--字-弱);
      }

      .行 {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .行 > label {
        flex: 1;
        min-width: 130px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 11px;
        color: var(--字-弱);
      }

      .按钮行 {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .按钮行 .按钮 {
        flex: 1;
        min-width: 120px;
      }

    </style>
  </head>
  <body>
    <div class="工具页">
      <!-- 左侧菜单 -->
      <nav class="工具菜单">
        <button class="工具菜单项 选中" data-页="应用">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1" />
            <rect x="9" y="2.5" width="4.5" height="4.5" rx="1" />
            <rect x="2.5" y="9" width="4.5" height="4.5" rx="1" />
            <rect x="9" y="9" width="4.5" height="4.5" rx="1" />
          </svg>
          应用管理
        </button>
        <button class="工具菜单项" data-页="进程">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M2 12l3-4 2.5 2.5L11 5l3 3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          进程管理
        </button>
        <button class="工具菜单项" data-页="文件">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M2 4.5a1 1 0 0 1 1-1h3l1.2 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4.5z" />
          </svg>
          文件管理
        </button>
        <button class="工具菜单项" data-页="外设">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="2" y="4" width="12" height="8" rx="1.5" />
            <circle cx="8" cy="8" r="2" />
          </svg>
          外设
        </button>
        <!--
          ADB 控制台已移出「更多功能」，改为主界面上的独立窗口按钮。
          控制台是常驻工具，塞在标签页里每次都要切页，体验不好。
        -->
      </nav>

      <!-- 右侧内容 -->
      <div class="工具内容">
        <header class="工具头">
          <h2 id="页标题">应用管理</h2>
          <span class="间隔"></span>
          <button class="次级按钮" id="刷新页">刷新</button>
        </header>

        <!-- 应用管理 -->
        <section class="工具体" data-体="应用">
          <div style="display: flex; gap: 8px; margin-bottom: 10px">
            <input class="输入框" id="应用搜索" placeholder="搜索包名…" style="flex: 1" />
            <button class="次级按钮" id="安装apk">安装 APK</button>
          </div>
          <div class="工具列表" id="应用列表"></div>
        </section>

        <!-- 进程管理 -->
        <section class="工具体" data-体="进程" hidden>
          <div style="display: flex; gap: 8px; margin-bottom: 10px">
            <input class="输入框" id="进程搜索" placeholder="搜索进程名…" style="flex: 1" />
          </div>
          <div class="工具列表" id="进程列表"></div>
        </section>

        <!-- 文件管理：双栏 + 多选 + 传输队列 -->
        <section class="工具体" data-体="文件" hidden style="overflow: hidden">
          <div class="文件双栏">
            <!-- 手机栏 -->
            <div class="文件栏">
              <div class="文件栏头">
                <span class="文件栏标">📱 手机</span>
                <span class="文件栏路径" id="手机路径">/sdcard</span>
              </div>
              <div class="文件工具条">
                <button class="图标按钮" id="手机上级" title="上一级">↑</button>
                <button class="图标按钮" id="手机刷新" title="刷新">⟳</button>
                <span class="工具条分隔"></span>
                <button class="次级按钮" id="手机全选">全选</button>
                <button class="次级按钮" id="手机复制">复制</button>
                <button class="次级按钮" id="手机粘贴">粘贴</button>
                <button class="次级按钮" id="手机重命名">重命名</button>
                <button class="次要按钮" id="手机删除">删除</button>
                <span class="间隔"></span>
                <button class="次要按钮" id="手机发送">发送 →</button>
              </div>
              <div class="文件表头">
                <span class="多选格"></span>
                <span class="列名">名称</span>
                <span class="列型">类型</span>
                <span class="列大">大小</span>
              </div>
              <div class="文件栏列表" id="手机文件"></div>
              <div class="文件栏脚" id="手机统计">0 项</div>
            </div>

            <!-- 电脑栏 -->
            <div class="文件栏">
              <div class="文件栏头">
                <span class="文件栏标">💻 本机</span>
                <span class="文件栏路径" id="电脑路径">此电脑</span>
              </div>
              <div class="文件工具条">
                <button class="图标按钮" id="电脑上级" title="上一级">↑</button>
                <button class="图标按钮" id="电脑刷新" title="刷新">⟳</button>
                <button class="图标按钮" id="电脑盘符" title="选择磁盘">💽</button>
                <span class="工具条分隔"></span>
                <button class="次级按钮" id="电脑全选">全选</button>
                <button class="次级按钮" id="电脑复制">复制</button>
                <button class="次级按钮" id="电脑粘贴">粘贴</button>
                <button class="次级按钮" id="电脑重命名">重命名</button>
                <button class="次要按钮" id="电脑删除">删除</button>
                <span class="间隔"></span>
                <button class="次要按钮" id="电脑接收">← 接收</button>
              </div>
              <div class="文件表头">
                <span class="多选格"></span>
                <span class="列名">名称</span>
                <span class="列型">类型</span>
                <span class="列大">大小</span>
              </div>
              <div class="文件栏列表" id="电脑文件"></div>
              <div class="文件栏脚" id="电脑统计">0 项</div>
            </div>
          </div>

          <!-- 传输队列 -->
          <div class="传输区">
            <div class="传输头">
              <span>传输列表</span>
              <span class="间隔"></span>
              <span class="传输提示" id="传输提示"></span>
            </div>
            <div class="传输列表" id="传输列表"></div>
          </div>
        </section>

        <!-- 外设：摄像头 / 麦克风（原独立窗口，现并入本页） -->
        <section class="工具体" data-体="外设" hidden>
          <div class="外设内容">
            <div class="外设状态行">
              <span class="外设状态" id="连接状态">未连接设备</span>
            </div>

            <section class="卡片">
              <h2>把手机当作摄像头</h2>
              <p class="卡片说明">
                打开后手机摄像头会在一张独立小窗里实时显示。
                其他软件（会议、直播工具）可以通过窗口捕获使用这个画面。
              </p>

              <div class="行">
                <label>
                  摄像头
                  <select class="选择框" id="摄像头选择">
                    <option value="">连接后加载…</option>
                  </select>
                </label>
                <label>
                  分辨率
                  <select class="选择框" id="摄像头尺寸">
                    <option value="1280x720">1280 × 720</option>
                    <option value="1920x1080">1920 × 1080</option>
                    <option value="640x480">640 × 480</option>
                  </select>
                </label>
                <label>
                  帧率
                  <select class="选择框" id="摄像头帧率">
                    <option value="30">30 fps</option>
                    <option value="60">60 fps</option>
                    <option value="15">15 fps</option>
                  </select>
                </label>
              </div>

              <!--
                用 div 而不是 label：label 只要点内部任何位置都会切换复选框，
                用户点文字时就误触了。改成 div 后只有点开关本身才切换。
              -->
              <div class="开关项">
                <span class="开关项文字">
                  <span class="开关项名">同时使用手机麦克风</span>
                  <span class="开关项注">手机采到的声音会送到电脑播放</span>
                </span>
                <span class="开关">
                  <input type="checkbox" id="使用麦克风" />
                  <span class="开关块"></span>
                </span>
              </div>

              <div class="按钮行">
                <button class="按钮 主" id="打开摄像头">打开摄像头预览</button>
                <button class="按钮" id="关闭摄像头" disabled>停止</button>
              </div>
            </section>

            <section class="卡片">
              <h2>把手机当作麦克风</h2>
              <p class="卡片说明">
                单独把手机麦克风接到电脑。适合手机离你更近、或电脑没有麦克风的情况。
              </p>
              <div class="按钮行">
                <button class="按钮" id="打开麦克风">开始使用手机麦克风</button>
                <button class="按钮" id="关闭麦克风" disabled>停止</button>
              </div>
            </section>

            <p class="卡片说明" id="外设提示">
              提示：摄像头与麦克风是两条独立通道，可以只开其中一个。
            </p>
          </div>
        </section>

        <!-- ADB 控制台 -->
        <section class="工具体" data-体="控制台" hidden style="overflow: hidden">
          <div class="控制台">
            <div class="控制台输出" id="控制台输出"></div>
            <div class="控制台输入行">
              <span class="控制台提示符">$</span>
              <input
                class="控制台输入"
                id="控制台输入"
                placeholder="输入 adb shell 命令，Tab 补全，回车执行"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- 补全下拉 -->
    <div class="补全框" id="补全框" hidden></div>

    <script type="module" src="./js/tools.js"></script>
  </body>
</html>
